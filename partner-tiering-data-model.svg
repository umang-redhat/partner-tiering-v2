<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="900" viewBox="0 0 1400 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px Arial, sans-serif; fill: #475569; }
      .section { font: 700 16px Arial, sans-serif; fill: #1e293b; }
      .boxTitle { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .boxBody { font: 400 13px Arial, sans-serif; fill: #334155; }
      .label { font: 600 12px Arial, sans-serif; fill: #334155; }
      .noteTitle { font: 700 15px Arial, sans-serif; fill: #14532d; }
      .noteBody { font: 400 13px Arial, sans-serif; fill: #166534; }
      .legend { font: 600 13px Arial, sans-serif; fill: #334155; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="dashArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1400" height="900" fill="#f8fafc"/>

  <text x="50" y="52" class="title">Partner Tiering v2 Data Model</text>
  <text x="50" y="78" class="subtitle">Standard Loyalty Management records on the left, custom partner-tier rule model on the right, and dynamic evaluation links between them.</text>

  <text x="70" y="130" class="section">Standard Loyalty Management Objects</text>
  <text x="760" y="130" class="section">Custom Partner Tiering Objects</text>

  <!-- Account -->
  <rect x="60" y="170" width="250" height="90" rx="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="80" y="200" class="boxTitle">Account</text>
  <text x="80" y="224" class="boxBody">" Name</text>
  <text x="80" y="244" class="boxBody">" Parent partner company record</text>

  <!-- LoyaltyProgram -->
  <rect x="360" y="170" width="300" height="110" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="380" y="200" class="boxTitle">LoyaltyProgram</text>
  <text x="380" y="224" class="boxBody">" Name</text>
  <text x="380" y="244" class="boxBody">" Type = LOYALTY_PROGRAM</text>
  <text x="380" y="264" class="boxBody">" Status = Active</text>

  <!-- LoyaltyProgramCurrency -->
  <rect x="360" y="330" width="300" height="130" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="380" y="360" class="boxTitle">LoyaltyProgramCurrency</text>
  <text x="380" y="384" class="boxBody">" LoyaltyProgramId</text>
  <text x="380" y="404" class="boxBody">" Name</text>
  <text x="380" y="424" class="boxBody">" CurrencyType = NonQualifying</text>
  <text x="380" y="444" class="boxBody">" Expiry config fields</text>

  <!-- LoyaltyProgramMember -->
  <rect x="60" y="530" width="600" height="180" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="80" y="560" class="boxTitle">LoyaltyProgramMember</text>
  <text x="80" y="584" class="boxBody">" ProgramId</text>
  <text x="80" y="604" class="boxBody">" AccountId</text>
  <text x="80" y="624" class="boxBody">" MemberStatus / MemberType / MembershipNumber / EnrollmentDate</text>
  <text x="80" y="644" class="boxBody">" Module enrollment flags: Build_Certify__c, Reseller__c</text>
  <text x="80" y="664" class="boxBody">" Evaluation inputs:</text>
  <text x="100" y="684" class="boxBody">- Account_Software_Product_Cert__c</text>
  <text x="100" y="702" class="boxBody">- Account_Hardware_Product_Cert__c</text>
  <text x="350" y="684" class="boxBody">- Account_RHSC_Credentials__c</text>
  <text x="350" y="702" class="boxBody">- Account_RHTSC_Credentials__c</text>
  <text x="350" y="720" class="boxBody">- Account_RH_Certifications__c</text>

  <!-- LoyaltyMemberCurrency -->
  <rect x="360" y="760" width="300" height="100" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="380" y="790" class="boxTitle">LoyaltyMemberCurrency</text>
  <text x="380" y="814" class="boxBody">" LoyaltyMemberId</text>
  <text x="380" y="834" class="boxBody">" LoyaltyProgramCurrencyId</text>
  <text x="380" y="854" class="boxBody">" TotalPointsAccrued / PointsBalance</text>

  <!-- PartnerTierRuleVersion -->
  <rect x="760" y="170" width="300" height="130" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="780" y="200" class="boxTitle">PartnerTierRuleVersion__c</text>
  <text x="780" y="224" class="boxBody">" Module__c = Build / Reseller</text>
  <text x="780" y="244" class="boxBody">" Tier__c = Unaffiliated / Ready / Advanced / Premier</text>
  <text x="780" y="264" class="boxBody">" Tier_Rank__c</text>
  <text x="780" y="284" class="boxBody">" In_Effect_Date__c / Status__c</text>

  <!-- PartnerTierRuleGroup -->
  <rect x="760" y="390" width="300" height="100" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="780" y="420" class="boxTitle">PartnerTierRuleGroup__c</text>
  <text x="780" y="444" class="boxBody">" Rule_Version__c (Master-Detail)</text>
  <text x="780" y="464" class="boxBody">" Group_Order__c</text>

  <!-- PartnerTierRuleCondition -->
  <rect x="760" y="560" width="300" height="150" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="780" y="590" class="boxTitle">PartnerTierRuleCondition__c</text>
  <text x="780" y="614" class="boxBody">" Rule_Group__c (Master-Detail)</text>
  <text x="780" y="634" class="boxBody">" Condition_Order__c</text>
  <text x="780" y="654" class="boxBody">" Field_API_Name__c</text>
  <text x="780" y="674" class="boxBody">" Operator__c</text>
  <text x="780" y="694" class="boxBody">" Threshold__c</text>

  <!-- Notes -->
  <rect x="1120" y="220" width="240" height="120" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="1140" y="250" class="noteTitle">Runtime Note</text>
  <text x="1140" y="274" class="noteBody">Field_API_Name__c dynamically</text>
  <text x="1140" y="292" class="noteBody">targets supported fields on</text>
  <text x="1140" y="310" class="noteBody">LoyaltyProgramMember.</text>

  <rect x="1120" y="500" width="240" height="120" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="1140" y="530" class="noteTitle">Points Note</text>
  <text x="1140" y="554" class="noteBody">MinimumEligibleBalance /</text>
  <text x="1140" y="572" class="noteBody">MaximumEligibleBalance are</text>
  <text x="1140" y="590" class="noteBody">compared against member points</text>
  <text x="1140" y="608" class="noteBody">from LoyaltyMemberCurrency.</text>

  <!-- Legend -->
  <rect x="1120" y="700" width="240" height="120" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1140" y="730" class="boxTitle">Legend</text>
  <rect x="1140" y="748" width="18" height="18" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="1170" y="762" class="legend">Standard loyalty objects</text>
  <rect x="1140" y="778" width="18" height="18" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="1170" y="792" class="legend">Custom partner-tier objects</text>
  <line x1="1140" y1="810" x2="1160" y2="810" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="1170" y="814" class="legend">Dynamic evaluation link</text>

  <!-- Solid relationships -->
  <line x1="310" y1="215" x2="360" y2="215" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="318" y="205" class="label">1..many via AccountId</text>

  <line x1="510" y1="280" x2="510" y2="330" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="520" y="312" class="label">1..many via LoyaltyProgramId</text>

  <line x1="360" y1="235" x2="240" y2="530" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="188" y="390" class="label">1..many via ProgramId</text>

  <line x1="510" y1="460" x2="510" y2="760" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="520" y="620" class="label">1..many via LoyaltyProgramCurrencyId</text>

  <line x1="360" y1="780" x2="260" y2="710" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="252" y="758" class="label">1..many via LoyaltyMemberId</text>

  <line x1="910" y1="300" x2="910" y2="390" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="920" y="350" class="label">1..many Rule_Groups</text>

  <line x1="910" y1="490" x2="910" y2="560" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="920" y="530" class="label">1..many Rule_Conditions</text>

  <!-- Dynamic/dashed relationships -->
  <line x1="1060" y1="625" x2="1120" y2="280" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#dashArrow)"/>
  <line x1="760" y1="650" x2="660" y2="650" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#dashArrow)"/>
  <text x="520" y="640" class="label">Field_API_Name__c resolves against member fields</text>

  <line x1="760" y1="690" x2="660" y2="810" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#dashArrow)"/>
  <text x="520" y="785" class="label">Point threshold checks resolve from member balances</text>
</svg>
